name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A validação de ambiente exige uma URL válida mesmo quando o banco não é usado.
  DATABASE_URL: postgresql://aurora:aurora@localhost:5432/aurora?schema=public
  # Gera o bundle autossuficiente do Next usado no container de produção.
  NEXT_OUTPUT: standalone

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Extensões de busca do Postgres
        run: |
          PGPASSWORD=aurora psql -h localhost -U aurora -d aurora \
            -f docker/postgres/init/01-extensions.sql

      - name: Aplicar migrations
        run: pnpm --filter @aurora/api run db:deploy

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
