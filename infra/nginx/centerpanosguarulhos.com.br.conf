# Armarinho Aurora
# O domínio já apontava para este servidor sem server block, então caía no
# site padrão e o certificado não batia. Este bloco resolve isso.

server {
    server_name armarinhoaurora.com.br www.armarinhoaurora.com.br;

    root /var/www/armarinhoaurora.com.br/public;
    index index.html;

    access_log /var/log/nginx/aurora.access.log;
    error_log  /var/log/nginx/aurora.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Imagens de teste da homologação. Ficam neste domínio porque precisam
    # ser públicas para o navegador carregá-las na vitrine protegida por
    # senha — mas nunca devem ser indexadas. Some quando as fotos reais
    # entrarem pelo painel.
    location ^~ /teste/ {
        add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
        try_files $uri =404;
    }

    # Validação do Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/armarinhoaurora.com.br/public;
        allow all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/armarinhoaurora.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/armarinhoaurora.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.armarinhoaurora.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = armarinhoaurora.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name armarinhoaurora.com.br www.armarinhoaurora.com.br;
    return 404; # managed by Certbot




}