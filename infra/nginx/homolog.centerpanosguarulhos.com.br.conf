# Armarinho Aurora — homologação
#
# Um host, três coisas:
#   /        -> vitrine Next.js (porta 3000)
#   /api/    -> API NestJS (porta 3333)
#   /painel/ -> painel administrativo (SPA estática)
#
# O host inteiro fica atrás de senha: a loja ainda não foi lançada e o
# catálogo está incompleto — ninguém deve tropeçar nele pelo Google.

server {
    listen 80;
    listen [::]:80;
    server_name homolog.armarinhoaurora.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/armarinhoaurora.com.br/public;
        allow all;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Sem `http2` aqui de propósito: no nginx 1.24 ele é opção do socket, não
    # do server block. Outro site do servidor já o habilita na mesma porta, e
    # repetir aqui só gera "protocol options redefined" no log.
    server_name homolog.armarinhoaurora.com.br;

    ssl_certificate     /etc/letsencrypt/live/homolog.armarinhoaurora.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog.armarinhoaurora.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ambiente de teste nunca deve ser indexado.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/aurora-homolog.access.log;
    error_log  /var/log/nginx/aurora-homolog.error.log;

    # O upload de imagem do catálogo precisa de folga.
    client_max_body_size 20M;

    # ── API ──────────────────────────────────────────────────────────────
    # Sem senha do nginx: a API tem autenticação própria (JWT + permissões),
    # que é mais forte. Somar a senha básica aqui não protege mais nada e
    # quebra o `fetch` do painel — o navegador não reenvia credencial básica
    # em requisição XHR quando ela veio pela URL.
    location /api/ {
        proxy_pass http://127.0.0.1:3333/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Painel administrativo (SPA) ──────────────────────────────────────
    # Também sem senha do nginx: são arquivos estáticos que não fazem nada
    # sem um login válido na API.
    location /painel/ {
        alias /opt/aurora-homolog/apps/admin/dist/;
        # Rotas do painel são do lado do cliente: o que não é arquivo cai no index.
        try_files $uri $uri/ /painel/index.html;
    }

    # ── Vitrine ──────────────────────────────────────────────────────────
    # Aqui sim: a loja ainda não foi lançada e o catálogo está incompleto.
    # A senha existe para ninguém tropeçar nela antes da hora.
    location / {
        auth_basic "Armarinho Aurora — homologação";
        auth_basic_user_file /etc/nginx/.htpasswd-aurora;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets do Next são versionados pelo hash: cache longo e seguro.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
