name: aurora

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
      # Necessário para ordenação/comparação correta de acentos em português
      LANG: pt_BR.utf8
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurora -d aurora']
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento S3-compatível — espelha o Cloudflare R2 de produção
  minio:
    image: minio/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aurora
      MINIO_ROOT_PASSWORD: aurora
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Cria o bucket automaticamente na subida
  minio-init:
    image: minio/mc:latest
    container_name: aurora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aurora aurora &&
      mc mb --ignore-existing local/aurora &&
      mc anonymous set download local/aurora &&
      echo 'Bucket aurora pronto.'
      "

  # Captura todos os e-mails em dev — nada sai da máquina.
  # UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: aurora-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  postgres-data:
  minio-data:
